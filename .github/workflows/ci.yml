name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .cache
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('scripts/fetch-chrome.mjs') }}
      - run: npm run fetch-chrome
      - run: npm run test:e2e
